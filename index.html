<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI旅游智能助手</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="app">
    <!-- 左侧会话栏 -->
    <aside class="sidebar">
      <button class="new-chat-btn" id="new-chat-btn">＋ 新建对话</button>
      <div class="session-list" id="session-list"></div>
    </aside>

    <!-- 右侧主区 -->
    <main class="main">
      <h1 class="main-title">AI旅游智能助手</h1>

      <div class="chat-card">
        <div class="chat-box" id="chat-box"></div>
        <button class="scroll-bottom-btn" id="scroll-bottom-btn" title="回到底部">↓</button>
      </div>

      <div class="input-area">
        <input type="text" id="message-input"
               placeholder="问我：北京3日游路线、上海酒店推荐、广州到成都机票..."
               autocomplete="off">
        <button id="send-btn">发送</button>
      </div>
    </main>
  </div>

  <script src="/static/js/markdown.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
